<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="">
  <title></title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <audio data-background-audio autoplay loop preload="metadata" playsinline webkit-playsinline aria-hidden="true"><source src="assets/musique-mariage.mp3" type="audio/mpeg"></audio>
  <script>
    (() => {
      const audio = document.querySelector('[data-background-audio]');
      const events = ['pointerup', 'touchend', 'click', 'keydown'];
      const unlock = () => {
        if (!audio.paused) {
          events.forEach(name => document.removeEventListener(name, unlock, true));
          return;
        }
        audio.play().then(() => {
          events.forEach(name => document.removeEventListener(name, unlock, true));
        }).catch(() => {});
      };
      events.forEach(name => document.addEventListener(name, unlock, { capture: true, passive: true }));
      audio.play().catch(() => {});
    })();
  </script>
  <main class="carousel" aria-label="Album photo">
    <div class="slides" aria-live="off"></div>
    <div class="ornaments" aria-hidden="true">
      <div class="ornament-frame"></div>
      <svg class="corner top-left" viewBox="0 0 100 100"><path d="M8 92V36C8 20 20 8 36 8H92M8 57h20c8 0 12-4 12-12V25c0-7 5-12 12-12h25M22 86V42c0-11 9-20 20-20h44M22 63h7c3 0 5-2 5-5V43c0-4 4-8 8-8h18"/><path d="m43 57 7-7 7 7-7 7z"/></svg>
      <svg class="corner top-right" viewBox="0 0 100 100"><path d="M8 92V36C8 20 20 8 36 8H92M8 57h20c8 0 12-4 12-12V25c0-7 5-12 12-12h25M22 86V42c0-11 9-20 20-20h44M22 63h7c3 0 5-2 5-5V43c0-4 4-8 8-8h18"/><path d="m43 57 7-7 7 7-7 7z"/></svg>
      <svg class="corner bottom-left" viewBox="0 0 100 100"><path d="M8 92V36C8 20 20 8 36 8H92M8 57h20c8 0 12-4 12-12V25c0-7 5-12 12-12h25M22 86V42c0-11 9-20 20-20h44M22 63h7c3 0 5-2 5-5V43c0-4 4-8 8-8h18"/><path d="m43 57 7-7 7 7-7 7z"/></svg>
      <svg class="corner bottom-right" viewBox="0 0 100 100"><path d="M8 92V36C8 20 20 8 36 8H92M8 57h20c8 0 12-4 12-12V25c0-7 5-12 12-12h25M22 86V42c0-11 9-20 20-20h44M22 63h7c3 0 5-2 5-5V43c0-4 4-8 8-8h18"/><path d="m43 57 7-7 7 7-7 7z"/></svg>
      <svg class="star top-star" viewBox="0 0 40 40"><path d="M20 2 23.8 14.2 36 10.4 25.8 18 34 28 21.8 24.2 18 38 14.2 24.2 2 28 10.2 18 0 10.4 16.2 14.2z"/></svg>
    </div>
    <div class="progress" aria-hidden="true"><span></span></div>
  </main>
</body>
</html>
