<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="">
  <title></title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <audio data-background-audio autoplay loop preload="metadata" playsinline webkit-playsinline aria-hidden="true"><source src="assets/musique-mariage.mp3" type="audio/mpeg"></audio>
  <script>
    (() => {
      const audio = document.querySelector('[data-background-audio]');
      const events = ['pointerup', 'touchend', 'click', 'keydown'];
      const unlock = () => {
        if (!audio.paused) {
          events.forEach(name => document.removeEventListener(name, unlock, true));
          return;
        }
        audio.play().then(() => {
          events.forEach(name => document.removeEventListener(name, unlock, true));
        }).catch(() => {});
      };
      events.forEach(name => document.addEventListener(name, unlock, { capture: true, passive: true }));
      audio.play().catch(() => {});
    })();
  </script>
  <main class="carousel" aria-label="Album photo">
    <div class="slides" aria-live="off"></div>
    <div class="controls">
      <button class="control previous" type="button" aria-label="Photo précédente">‹</button>
      <button class="control toggle" type="button" aria-label="Mettre le diaporama en pause" aria-pressed="true">Ⅱ</button>
      <button class="control next" type="button" aria-label="Photo suivante">›</button>
    </div>
    <div class="progress" aria-hidden="true"><span></span></div>
  </main>
</body>
</html>
