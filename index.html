<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="">
  <title></title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <audio data-background-audio autoplay loop preload="metadata" playsinline webkit-playsinline aria-hidden="true"><source src="assets/musique-mariage.mp3" type="audio/mpeg"></audio>
  <script>
    (() => {
      const audio = document.querySelector('[data-background-audio]');
      const events = ['pointerup', 'touchend', 'click', 'keydown'];
      const unlock = () => {
        if (!audio.paused) {
          events.forEach(name => document.removeEventListener(name, unlock, true));
          return;
        }
        audio.play().then(() => {
          events.forEach(name => document.removeEventListener(name, unlock, true));
        }).catch(() => {});
      };
      events.forEach(name => document.addEventListener(name, unlock, { capture: true, passive: true }));
      audio.play().catch(() => {});
    })();
  </script>
  <main class="carousel" aria-label="Album photo">
    <div class="slides" aria-live="off"></div>
    <div class="ornaments" aria-hidden="true">
      <svg class="side-motif side-left" viewBox="0 0 100 400" preserveAspectRatio="xMidYMid meet">
        <path d="M50 22v38m0 280v38M50 60C50 78 27 74 27 94s23 20 23 38m0-72c0 18 23 14 23 34s-23 20-23 38M50 138v39m0 46v39m0 39v39"/>
        <path d="M50 177c0 18-24 17-24 32s24 14 24 29m0-61c0 18 24 17 24 32s-24 14-24 29M50 216c0 17-18 21-18 37s18 20 18 32m0-69c0 17 18 21 18 37s-18 20-18 32"/>
        <path class="rosette" d="m50 185 6 13 14 2-10 9 3 14-13-7-13 7 3-14-10-9 14-2z"/>
        <path d="m50 74 5 8-5 8-5-8zm0 227 5 8-5 8-5-8z"/>
      </svg>
      <svg class="side-motif side-right" viewBox="0 0 100 400" preserveAspectRatio="xMidYMid meet">
        <path d="M50 22v38m0 280v38M50 60C50 78 27 74 27 94s23 20 23 38m0-72c0 18 23 14 23 34s-23 20-23 38M50 138v39m0 46v39m0 39v39"/>
        <path d="M50 177c0 18-24 17-24 32s24 14 24 29m0-61c0 18 24 17 24 32s-24 14-24 29M50 216c0 17-18 21-18 37s18 20 18 32m0-69c0 17 18 21 18 37s-18 20-18 32"/>
        <path class="rosette" d="m50 185 6 13 14 2-10 9 3 14-13-7-13 7 3-14-10-9 14-2z"/>
        <path d="m50 74 5 8-5 8-5-8zm0 227 5 8-5 8-5-8z"/>
      </svg>
    </div>
  </main>
</body>
</html>
