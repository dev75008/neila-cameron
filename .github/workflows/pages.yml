name: Déployer le site sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer les fichiers du site
        run: |
          touch .nojekyll
          tar --exclude=.git --exclude=.github -czf "$RUNNER_TEMP/pages.tar.gz" .
          mkdir "$RUNNER_TEMP/site"
          tar -xzf "$RUNNER_TEMP/pages.tar.gz" -C "$RUNNER_TEMP/site"
      - name: Téléverser le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
